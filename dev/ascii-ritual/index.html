<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Ascii Ritual — Implode</title>
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link
      href="https://fonts.googleapis.com/css2?family=Press+Start+2P&display=swap"
      rel="stylesheet"
    />
    <script src="https://cdn.tailwindcss.com"></script>
    <style>
      /*
       * TIMING — edit CONFIG in the script below for ramp / implode knobs.
       */
      :root {
        --radius: min(36vmin, 240px);
      }

      html,
      body {
        height: 100%;
        margin: 0;
        background: #ffffff;
        overflow: hidden;
      }

      /* Do not name this class "ring" — Tailwind's ring utility draws a blue box. */
      .mantra-wheel {
        position: relative;
        width: min(78vmin, 520px);
        height: min(78vmin, 520px);
        will-change: transform;
      }

      .mantra-char {
        position: absolute;
        left: 50%;
        top: 50%;
        font-family: "Press Start 2P", monospace;
        font-size: clamp(0.65rem, 2vmin, 1rem);
        color: #111111;
        line-height: 1;
        transform-origin: center;
        user-select: none;
        white-space: pre;
        will-change: transform, opacity;
      }

      /* Final 10px black singularity at the circle center */
      .singularity {
        position: absolute;
        left: 50%;
        top: 50%;
        width: 10px;
        height: 10px;
        margin: -5px 0 0 -5px;
        border-radius: 50%;
        background: #111111;
        opacity: 0;
        transform: scale(0);
        pointer-events: none;
        will-change: transform, opacity;
      }
    </style>
  </head>
  <body class="bg-white">
    <main class="flex h-full w-full items-center justify-center bg-white">
      <div
        class="mantra-wheel"
        id="mantra-wheel"
        role="img"
        aria-label="End Rumination Through Decisive Acceptance"
      >
        <div class="singularity" id="singularity" aria-hidden="true"></div>
      </div>
    </main>
    <script>
      (function () {
        /*
         * CONFIG — easy knobs
         * RAMP_MS: slow → max speed (10s while tuning; set back to 60*1000 later)
         * START_RPS / END_RPS: revolutions per second at start / end of ramp
         * IMPLODE_MS: total collapse window (letters stagger inside this)
         * WORD_GAP_SLOTS: space between words on the circle
         * DOT_PX: final black dot diameter
         */
        var CONFIG = {
          MESSAGE: "End Rumination Through Decisive Acceptance",
          WORD_GAP_SLOTS: 2.5,
          RAMP_MS: 10 * 1000,
          START_RPS: 0.03,
          END_RPS: 8,
          IMPLODE_MS: 1600,
          DOT_PX: 10,
        };

        var wheel = document.getElementById("mantra-wheel");
        var singularity = document.getElementById("singularity");
        singularity.style.width = CONFIG.DOT_PX + "px";
        singularity.style.height = CONFIG.DOT_PX + "px";
        singularity.style.margin =
          "-" + CONFIG.DOT_PX / 2 + "px 0 0 -" + CONFIG.DOT_PX / 2 + "px";

        var reduceMotion = window.matchMedia(
          "(prefers-reduced-motion: reduce)"
        ).matches;

        var words = CONFIG.MESSAGE.trim().split(/\s+/);
        var totalLetters = 0;
        for (var w = 0; w < words.length; w++) totalLetters += words[w].length;

        var gapCount = words.length;
        var totalSlots = totalLetters + gapCount * CONFIG.WORD_GAP_SLOTS;
        var slotAngle = 360 / totalSlots;
        var angle = 0;
        var charEls = [];

        function placeChar(ch, deg) {
          var span = document.createElement("span");
          span.className = "mantra-char";
          span.textContent = ch;
          span.dataset.angle = String(deg);
          span.style.transform =
            "translate(-50%, -50%) rotate(" +
            deg +
            "deg) translateY(calc(-1 * var(--radius))) scale(1)";
          wheel.appendChild(span);
          charEls.push(span);
        }

        for (var i = 0; i < words.length; i++) {
          var word = words[i];
          for (var c = 0; c < word.length; c++) {
            placeChar(word.charAt(c), angle);
            angle += slotAngle;
          }
          angle += slotAngle * CONFIG.WORD_GAP_SLOTS;
        }

        function easeInCubic(t) {
          return t * t * t;
        }

        function easeInQuint(t) {
          return t * t * t * t * t;
        }

        function setCharPose(el, deg, radiusFactor, scale, opacity, swirl) {
          el.style.opacity = String(opacity);
          el.style.transform =
            "translate(-50%, -50%) rotate(" +
            (deg + swirl) +
            "deg) translateY(calc(-1 * var(--radius) * " +
            radiusFactor +
            ")) scale(" +
            scale +
            ")";
        }

        var rotation = 0;
        var lastTs = null;
        var startTs = null;
        var phase = "ramp";

        function implode(now) {
          phase = "implode";
          var implodeStart = now;
          var startRotation = rotation;
          var n = charEls.length;

          // Stagger: letters suck in around the circle in a whirl, not all at once
          var delays = [];
          for (var i = 0; i < n; i++) {
            var base = (i / n) * 0.45;
            var jitter = ((i * 17) % 7) / 7 * 0.12;
            delays.push(Math.min(0.55, base + jitter));
          }

          function implodeFrame(ts) {
            var u = Math.min(1, (ts - implodeStart) / CONFIG.IMPLODE_MS);

            // Wheel keeps a dying whirl; decelerates as matter falls in
            var whirl = (1 - easeInCubic(u)) * 540;
            rotation = startRotation + whirl;
            wheel.style.transform = "rotate(" + rotation + "deg)";

            var arrived = 0;
            for (var i = 0; i < n; i++) {
              var el = charEls[i];
              var deg = parseFloat(el.dataset.angle);
              var local = (u - delays[i]) / (1 - delays[i]);
              if (local < 0) local = 0;
              if (local > 1) local = 1;

              var e = easeInQuint(local);
              // Rush inward; slight extra swirl as they fall
              var radiusFactor = 1 - e;
              var scale = 1 - e * 0.92;
              var swirl = e * (120 + (i % 5) * 24);
              var opacity = local < 0.92 ? 1 : 1 - (local - 0.92) / 0.08;

              setCharPose(el, deg, radiusFactor, Math.max(0.05, scale), opacity, swirl);
              if (local >= 1) arrived++;
            }

            // Dot grows as letters pile into the center
            var gather = Math.max(0, (u - 0.35) / 0.65);
            var ge = easeInCubic(gather);
            singularity.style.opacity = String(Math.min(1, ge * 1.2));
            singularity.style.transform = "scale(" + (0.15 + ge * 0.85) + ")";

            if (u < 1) {
              requestAnimationFrame(implodeFrame);
            } else {
              phase = "done";
              for (var j = 0; j < n; j++) {
                charEls[j].style.opacity = "0";
              }
              singularity.style.opacity = "1";
              singularity.style.transform = "scale(1)";
              wheel.style.transform = "rotate(" + rotation + "deg)";
            }
          }

          requestAnimationFrame(implodeFrame);
        }

        function tick(ts) {
          if (startTs === null) startTs = ts;
          if (lastTs === null) lastTs = ts;
          var dt = Math.min(0.05, (ts - lastTs) / 1000);
          lastTs = ts;

          if (phase === "ramp") {
            var t = Math.min(1, (ts - startTs) / CONFIG.RAMP_MS);
            var rps =
              CONFIG.START_RPS +
              (CONFIG.END_RPS - CONFIG.START_RPS) * easeInCubic(t);
            rotation += rps * 360 * dt;
            wheel.style.transform = "rotate(" + rotation + "deg)";

            if (t >= 1) {
              implode(ts);
              return;
            }
            requestAnimationFrame(tick);
          }
        }

        if (reduceMotion) {
          return;
        }

        requestAnimationFrame(tick);
      })();
    </script>
  </body>
</html>
