<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Ascii Ritual — Implode</title>
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link
      href="https://fonts.googleapis.com/css2?family=Press+Start+2P&display=swap"
      rel="stylesheet"
    />
    <script src="https://cdn.tailwindcss.com"></script>
    <style>
      /*
       * TIMING — edit CONFIG in the script below for ramp / implode knobs.
       */
      :root {
        --radius: min(36vmin, 240px);
      }

      html,
      body {
        height: 100%;
        margin: 0;
        background: #ffffff;
        overflow: hidden;
      }

      /* Do not name this class "ring" — Tailwind's ring utility draws a blue box. */
      .mantra-wheel {
        position: relative;
        width: min(78vmin, 520px);
        height: min(78vmin, 520px);
        will-change: transform;
      }

      .mantra-char {
        position: absolute;
        left: 50%;
        top: 50%;
        font-family: "Press Start 2P", monospace;
        font-size: clamp(0.65rem, 2vmin, 1rem);
        color: #111111;
        line-height: 1;
        transform-origin: center;
        user-select: none;
        white-space: pre;
        will-change: transform, opacity;
      }

      /* Final black singularity at the circle center */
      .singularity {
        position: absolute;
        left: 50%;
        top: 50%;
        width: 100px;
        height: 100px;
        margin: -50px 0 0 -50px;
        border-radius: 50%;
        background: #111111;
        opacity: 0;
        transform: scale(0);
        pointer-events: none;
        will-change: transform, opacity;
        z-index: 2;
      }
    </style>
  </head>
  <body class="bg-white">
    <main class="flex h-full w-full items-center justify-center bg-white">
      <div
        class="mantra-wheel"
        id="mantra-wheel"
        role="img"
        aria-label="End Rumination Through Decisive Acceptance"
      >
        <div class="singularity" id="singularity" aria-hidden="true"></div>
      </div>
    </main>
    <script>
      (function () {
        /*
         * CONFIG — easy knobs
         * RAMP_MS: slow → max speed (10s while tuning; set back to 60*1000 later)
         * START_RPS / END_RPS: revolutions per second at start / end of ramp
         * IMPLODE_MS: break-apart + suck-in window
         * WORD_GAP_SLOTS: space between words on the circle
         * DOT_PX: final black dot diameter
         */
        var CONFIG = {
          MESSAGE: "End Rumination Through Decisive Acceptance",
          WORD_GAP_SLOTS: 2.5,
          RAMP_MS: 10 * 1000,
          START_RPS: 0.03,
          END_RPS: 8,
          IMPLODE_MS: 2200,
          DOT_PX: 100,
        };

        var wheel = document.getElementById("mantra-wheel");
        var singularity = document.getElementById("singularity");
        singularity.style.width = CONFIG.DOT_PX + "px";
        singularity.style.height = CONFIG.DOT_PX + "px";
        singularity.style.margin =
          "-" + CONFIG.DOT_PX / 2 + "px 0 0 -" + CONFIG.DOT_PX / 2 + "px";

        var reduceMotion = window.matchMedia(
          "(prefers-reduced-motion: reduce)"
        ).matches;

        var words = CONFIG.MESSAGE.trim().split(/\s+/);
        var totalLetters = 0;
        for (var w = 0; w < words.length; w++) totalLetters += words[w].length;

        var gapCount = words.length;
        var totalSlots = totalLetters + gapCount * CONFIG.WORD_GAP_SLOTS;
        var slotAngle = 360 / totalSlots;
        var angle = 0;
        var charEls = [];

        function placeChar(ch, deg) {
          var span = document.createElement("span");
          span.className = "mantra-char";
          span.textContent = ch;
          span.dataset.angle = String(deg);
          // Deterministic “personality” for break-apart (no Math.random → no jumps on rerun)
          var seed = (deg * 13 + ch.charCodeAt(0) * 7) % 1000;
          span.dataset.burst = String(1.12 + (seed % 40) / 100); // outward peak 1.12–1.51
          span.dataset.spinDir = String(seed % 2 === 0 ? 1 : -1);
          span.dataset.spinAmt = String(80 + (seed % 160));
          span.style.transform =
            "translate(-50%, -50%) rotate(" +
            deg +
            "deg) translateY(calc(-1 * var(--radius))) scale(1)";
          wheel.appendChild(span);
          charEls.push(span);
        }

        for (var i = 0; i < words.length; i++) {
          var word = words[i];
          for (var c = 0; c < word.length; c++) {
            placeChar(word.charAt(c), angle);
            angle += slotAngle;
          }
          angle += slotAngle * CONFIG.WORD_GAP_SLOTS;
        }

        function easeInCubic(t) {
          return t * t * t;
        }

        function easeOutCubic(t) {
          return 1 - Math.pow(1 - t, 3);
        }

        function easeInQuint(t) {
          return t * t * t * t * t;
        }

        function clamp01(t) {
          if (t < 0) return 0;
          if (t > 1) return 1;
          return t;
        }

        /**
         * Per-letter life during implode (0→1 local):
         * 0–0.35  fall apart: peel off the ring, burst slightly outward, tumble
         * 0.35–1  implode: rush to center and vanish into the singularity
         */
        function poseLetter(el, local) {
          var deg = parseFloat(el.dataset.angle);
          var burst = parseFloat(el.dataset.burst);
          var spinDir = parseFloat(el.dataset.spinDir);
          var spinAmt = parseFloat(el.dataset.spinAmt);
          var radiusFactor;
          var scale;
          var swirl;
          var opacity = 1;

          if (local < 0.35) {
            var a = easeOutCubic(local / 0.35);
            radiusFactor = 1 + (burst - 1) * a;
            scale = 1 + 0.15 * a;
            swirl = spinDir * spinAmt * 0.35 * a;
          } else {
            var b = easeInQuint((local - 0.35) / 0.65);
            radiusFactor = burst * (1 - b);
            scale = Math.max(0.04, 1.15 * (1 - b * 0.96));
            swirl = spinDir * spinAmt * (0.35 + 0.65 * b);
            if (b > 0.85) opacity = 1 - (b - 0.85) / 0.15;
          }

          el.style.opacity = String(opacity);
          el.style.transform =
            "translate(-50%, -50%) rotate(" +
            (deg + swirl) +
            "deg) translateY(calc(-1 * var(--radius) * " +
            radiusFactor +
            ")) scale(" +
            scale +
            ")";
        }

        var rotation = 0;
        var lastTs = null;
        var startTs = null;
        var phase = "ramp";
        var currentRps = CONFIG.START_RPS;

        function implode(now) {
          phase = "implode";
          var implodeStart = now;
          var n = charEls.length;

          // Stagger so letters fall apart / suck in individually around the circle
          var delays = [];
          for (var i = 0; i < n; i++) {
            delays.push((i / n) * 0.5 + (((i * 19) % 5) / 5) * 0.08);
          }

          function implodeFrame(ts) {
            if (lastTs === null) lastTs = ts;
            var dt = Math.min(0.05, (ts - lastTs) / 1000);
            lastTs = ts;

            // Seamless: keep spinning the SAME direction at peak speed (no reverse)
            currentRps = CONFIG.END_RPS;
            rotation += currentRps * 360 * dt;
            wheel.style.transform = "rotate(" + rotation + "deg)";

            var u = clamp01((ts - implodeStart) / CONFIG.IMPLODE_MS);

            for (var i = 0; i < n; i++) {
              var local = clamp01((u - delays[i]) / (1 - delays[i] * 0.85));
              poseLetter(charEls[i], local);
            }

            // Dot grows as letters arrive — does not affect wheel direction
            var gather = clamp01((u - 0.4) / 0.6);
            var ge = easeInCubic(gather);
            singularity.style.opacity = String(Math.min(1, ge * 1.15));
            singularity.style.transform = "scale(" + (0.08 + ge * 0.92) + ")";

            if (u < 1) {
              requestAnimationFrame(implodeFrame);
            } else {
              phase = "done";
              for (var j = 0; j < n; j++) {
                charEls[j].style.opacity = "0";
              }
              singularity.style.opacity = "1";
              singularity.style.transform = "scale(1)";
              // Hold final spin pose; no direction change
              wheel.style.transform = "rotate(" + rotation + "deg)";
            }
          }

          requestAnimationFrame(implodeFrame);
        }

        function tick(ts) {
          if (startTs === null) startTs = ts;
          if (lastTs === null) lastTs = ts;
          var dt = Math.min(0.05, (ts - lastTs) / 1000);
          lastTs = ts;

          if (phase === "ramp") {
            var t = clamp01((ts - startTs) / CONFIG.RAMP_MS);
            currentRps =
              CONFIG.START_RPS +
              (CONFIG.END_RPS - CONFIG.START_RPS) * easeInCubic(t);
            // Always integrate forward — never assign an absolute decreasing angle
            rotation += currentRps * 360 * dt;
            wheel.style.transform = "rotate(" + rotation + "deg)";

            if (t >= 1) {
              implode(ts);
              return;
            }
            requestAnimationFrame(tick);
          }
        }

        if (reduceMotion) {
          return;
        }

        requestAnimationFrame(tick);
      })();
    </script>
  </body>
</html>
