<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Fortune Teller Ring</title>
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link
      href="https://fonts.googleapis.com/css2?family=Press+Start+2P&display=swap"
      rel="stylesheet"
    />
    <script src="https://cdn.tailwindcss.com"></script>
    <style>
      /*
       * SPEED CONTROL
       * Change --spin-duration below.
       * Smaller number = faster spin. Larger = slower.
       * Examples: 10s (fast), 28s (default), 60s (slow)
       */
      :root {
        --spin-duration: 28s;
      }

      html,
      body {
        height: 100%;
        margin: 0;
        background: #ffffff;
        overflow: hidden;
      }

      /* Class must NOT be "ring" — Tailwind's `ring` utility draws a blue box. */
      .mantra-wheel {
        --radius: min(36vmin, 240px);
        position: relative;
        width: min(78vmin, 520px);
        height: min(78vmin, 520px);
        animation: spin var(--spin-duration) linear infinite;
      }

      .mantra-char {
        position: absolute;
        left: 50%;
        top: 50%;
        font-family: "Press Start 2P", monospace;
        font-size: clamp(0.65rem, 2vmin, 1rem);
        color: #111111;
        line-height: 1;
        transform-origin: center;
        user-select: none;
        white-space: pre;
      }

      @keyframes spin {
        from {
          transform: rotate(0deg);
        }
        to {
          transform: rotate(360deg);
        }
      }

      @media (prefers-reduced-motion: reduce) {
        .mantra-wheel {
          animation: none;
        }
      }
    </style>
  </head>
  <body class="bg-white">
    <main class="flex h-full w-full items-center justify-center bg-white">
      <div
        class="mantra-wheel"
        id="mantra-wheel"
        role="img"
        aria-label="End Rumination Through Decisive Acceptance"
      ></div>
    </main>
    <script>
      (function () {
        var MESSAGE = "End Rumination Through Decisive Acceptance";
        // Extra letter-slots between words (including Acceptance → End wrap).
        // Higher = more even/open word spacing. 1 ≈ single space; 2–3 feels even.
        var WORD_GAP_SLOTS = 2.5;

        var wheel = document.getElementById("mantra-wheel");
        var words = MESSAGE.trim().split(/\s+/);
        var totalLetters = 0;
        for (var w = 0; w < words.length; w++) totalLetters += words[w].length;

        var gapCount = words.length; // one gap after every word, including wrap
        var totalSlots = totalLetters + gapCount * WORD_GAP_SLOTS;
        var slotAngle = 360 / totalSlots;
        var angle = 0;

        function placeChar(ch, deg) {
          var span = document.createElement("span");
          span.className = "mantra-char";
          span.textContent = ch;
          // Absolute radius (inherited --radius). Percent translateY would be
          // relative to each glyph box and collapse the circle to the center.
          span.style.transform =
            "translate(-50%, -50%) rotate(" +
            deg +
            "deg) translateY(calc(-1 * var(--radius)))";
          wheel.appendChild(span);
        }

        for (var i = 0; i < words.length; i++) {
          var word = words[i];
          for (var c = 0; c < word.length; c++) {
            placeChar(word.charAt(c), angle);
            angle += slotAngle;
          }
          angle += slotAngle * WORD_GAP_SLOTS;
        }
      })();
    </script>
  </body>
</html>
