<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Fortune Teller Ring</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <style>
      /*
       * TIMING — edit CONFIG in the script below.
       * Font: Thumby default font5x7.bin (5×7 VLSB bitmap).
       */
      :root {
        --radius: min(36vmin, 240px);
      }

      html,
      body {
        height: 100%;
        margin: 0;
        background: #ffffff;
        overflow: hidden;
      }

      /* Do not name this class "ring" — Tailwind's ring utility draws a blue box. */
      .mantra-wheel {
        position: relative;
        width: min(78vmin, 520px);
        height: min(78vmin, 520px);
        will-change: transform;
      }

      .mantra-char {
        position: absolute;
        left: 50%;
        top: 50%;
        image-rendering: pixelated;
        image-rendering: crisp-edges;
        transform-origin: center;
        user-select: none;
        will-change: transform, opacity;
      }

      .singularity {
        position: absolute;
        left: 50%;
        top: 50%;
        width: 25px;
        height: 25px;
        margin: -12.5px 0 0 -12.5px;
        border-radius: 50%;
        background: #111111;
        opacity: 0;
        transform: scale(0);
        pointer-events: none;
        will-change: transform, opacity;
        z-index: 2;
      }
    </style>
  </head>
  <body class="bg-white">
    <main class="flex h-full w-full items-center justify-center bg-white">
      <div
        class="mantra-wheel"
        id="mantra-wheel"
        role="img"
        aria-label="End Rumination Through Decisive Acceptance"
      >
        <div class="singularity" id="singularity" aria-hidden="true"></div>
      </div>
    </main>
    <script>
      (function () {
        /*
         * CONFIG — easy knobs
         * After the speed ramp, letters particle-fall into the center
         * one-by-one in random order (particlizer).
         */
        var CONFIG = {
          MESSAGE: "End Rumination Through Decisive Acceptance",
          WORD_GAP_SLOTS: 2.5,
          RAMP_MS: 10 * 1000,
          START_RPS: 0.03,
          END_RPS: 8,
          // Particlizer
          PARTICLE_STAGGER_MS: 55, // delay between releasing each letter
          PARTICLE_STAGGER_JITTER_MS: 45, // random extra delay per letter
          PARTICLE_FLIGHT_MS: 520, // time for one letter to reach the center
          PARTICLE_FLIGHT_JITTER_MS: 180, // random extra flight time
          DOT_PX: 25,
          FONT_URL: "font5x7.bin",
          FONT_W: 5,
          FONT_H: 7,
          PIXEL_SCALE: 2,
          INK: "#111111",
        };

        var wheel = document.getElementById("mantra-wheel");
        var singularity = document.getElementById("singularity");
        singularity.style.width = CONFIG.DOT_PX + "px";
        singularity.style.height = CONFIG.DOT_PX + "px";
        singularity.style.margin =
          "-" + CONFIG.DOT_PX / 2 + "px 0 0 -" + CONFIG.DOT_PX / 2 + "px";

        var reduceMotion = window.matchMedia(
          "(prefers-reduced-motion: reduce)"
        ).matches;

        var charEls = [];
        var fontData = null;

        function glyphCanvas(ch) {
          var idx = ch.charCodeAt(0) - 0x20;
          if (idx < 0 || idx >= fontData.length / CONFIG.FONT_W) {
            idx = "?".charCodeAt(0) - 0x20;
          }
          var scale = CONFIG.PIXEL_SCALE;
          var canvas = document.createElement("canvas");
          canvas.width = CONFIG.FONT_W * scale;
          canvas.height = CONFIG.FONT_H * scale;
          canvas.className = "mantra-char";
          canvas.setAttribute("aria-hidden", "true");
          var ctx = canvas.getContext("2d");
          ctx.fillStyle = CONFIG.INK;
          var offset = idx * CONFIG.FONT_W;
          for (var col = 0; col < CONFIG.FONT_W; col++) {
            var byte = fontData[offset + col];
            for (var row = 0; row < CONFIG.FONT_H; row++) {
              if (byte & (1 << row)) {
                ctx.fillRect(col * scale, row * scale, scale, scale);
              }
            }
          }
          return canvas;
        }

        function placeChar(ch, deg) {
          var el = glyphCanvas(ch);
          el.dataset.angle = String(deg);
          el.style.transform =
            "translate(-50%, -50%) rotate(" +
            deg +
            "deg) translateY(calc(-1 * var(--radius))) scale(1)";
          // Particle personality (filled when particlizer starts)
          el._particle = null;
          wheel.appendChild(el);
          charEls.push(el);
        }

        function buildRing() {
          var words = CONFIG.MESSAGE.trim().split(/\s+/);
          var totalLetters = 0;
          for (var w = 0; w < words.length; w++) totalLetters += words[w].length;
          var gapCount = words.length;
          var totalSlots = totalLetters + gapCount * CONFIG.WORD_GAP_SLOTS;
          var slotAngle = 360 / totalSlots;
          var angle = 0;

          for (var i = 0; i < words.length; i++) {
            var word = words[i];
            for (var c = 0; c < word.length; c++) {
              placeChar(word.charAt(c), angle);
              angle += slotAngle;
            }
            angle += slotAngle * CONFIG.WORD_GAP_SLOTS;
          }
        }

        function easeInCubic(t) {
          return t * t * t;
        }

        function easeInQuad(t) {
          return t * t;
        }

        function clamp01(t) {
          if (t < 0) return 0;
          if (t > 1) return 1;
          return t;
        }

        function shuffle(arr) {
          for (var i = arr.length - 1; i > 0; i--) {
            var j = (Math.random() * (i + 1)) | 0;
            var tmp = arr[i];
            arr[i] = arr[j];
            arr[j] = tmp;
          }
          return arr;
        }

        function poseOnRing(el) {
          var deg = parseFloat(el.dataset.angle);
          el.style.opacity = "1";
          el.style.transform =
            "translate(-50%, -50%) rotate(" +
            deg +
            "deg) translateY(calc(-1 * var(--radius))) scale(1)";
        }

        /** Particle flight 0→1: leave rim, tumble inward, vanish into center */
        function poseParticle(el, t) {
          var p = el._particle;
          var e = easeInQuad(t);
          // Mostly radial collapse, with a random sideways wobble that dies out
          var wobble = Math.sin(t * Math.PI) * p.wobbleDeg;
          var deg = p.startAngle + wobble + p.spin * e;
          var radiusFactor = 1 - e;
          // Slight outward kick at the very start so it “breaks off” as a particle
          if (t < 0.12) {
            radiusFactor = 1 + 0.08 * (1 - t / 0.12);
          } else {
            var u = (t - 0.12) / 0.88;
            radiusFactor = (1 + 0.08) * (1 - easeInCubic(u));
          }
          // Stay fully opaque and full size — letters fall into the black circle
          el.style.opacity = "1";
          el.style.transform =
            "translate(-50%, -50%) rotate(" +
            deg +
            "deg) translateY(calc(-1 * var(--radius) * " +
            radiusFactor +
            ")) scale(1)";
        }

        var rotation = 0;
        var lastTs = null;
        var startTs = null;
        var phase = "ramp";
        var currentRps = CONFIG.START_RPS;
        var arrivedCount = 0;

        function startParticlizer(now) {
          phase = "particles";
          arrivedCount = 0;
          // Black circle starts tiny and grows as letters land
          singularity.style.opacity = "1";
          singularity.style.transform = "scale(0.08)";
          var n = charEls.length;
          var order = shuffle(
            charEls.map(function (_, i) {
              return i;
            })
          );

          var releaseAt = 0;
          for (var k = 0; k < n; k++) {
            var el = charEls[order[k]];
            var stagger =
              CONFIG.PARTICLE_STAGGER_MS +
              Math.random() * CONFIG.PARTICLE_STAGGER_JITTER_MS;
            releaseAt += stagger;
            var flight =
              CONFIG.PARTICLE_FLIGHT_MS +
              Math.random() * CONFIG.PARTICLE_FLIGHT_JITTER_MS;
            el._particle = {
              releaseAt: now + releaseAt,
              flightMs: flight,
              startAngle: parseFloat(el.dataset.angle),
              wobbleDeg: (Math.random() * 2 - 1) * 55,
              spin: (Math.random() * 2 - 1) * 420,
              done: false,
              started: false,
            };
          }

          // Total duration ≈ last release + its flight
          var endAt = now + releaseAt + CONFIG.PARTICLE_FLIGHT_MS + CONFIG.PARTICLE_FLIGHT_JITTER_MS + 200;

          function particleFrame(ts) {
            if (lastTs === null) lastTs = ts;
            var dt = Math.min(0.05, (ts - lastTs) / 1000);
            lastTs = ts;

            // Keep spinning continuously at max speed
            currentRps = CONFIG.END_RPS;
            rotation += currentRps * 360 * dt;
            wheel.style.transform = "rotate(" + rotation + "deg)";

            arrivedCount = 0;
            for (var i = 0; i < n; i++) {
              var el = charEls[i];
              var p = el._particle;
              if (!p) continue;

              if (ts < p.releaseAt) {
                poseOnRing(el);
                continue;
              }

              if (!p.started) {
                p.started = true;
                p.startTs = ts;
              }

              var t = clamp01((ts - p.startTs) / p.flightMs);
              if (t >= 1) {
                if (!p.done) {
                  p.done = true;
                  // Snap into the black circle (hide only once fully arrived)
                  el.style.opacity = "0";
                }
                arrivedCount++;
              } else {
                poseParticle(el, t);
              }
            }

            // Black circle grows slowly as it fills with letters (linear with arrivals)
            var gather = arrivedCount / n;
            singularity.style.opacity = "1";
            singularity.style.transform =
              "scale(" + (0.08 + gather * 0.92) + ")";

            if (arrivedCount < n || ts < endAt) {
              requestAnimationFrame(particleFrame);
            } else {
              phase = "done";
              for (var j = 0; j < n; j++) charEls[j].style.opacity = "0";
              singularity.style.opacity = "1";
              singularity.style.transform = "scale(1)";
              wheel.style.transform = "rotate(" + rotation + "deg)";
            }
          }

          requestAnimationFrame(particleFrame);
        }

        function tick(ts) {
          if (startTs === null) startTs = ts;
          if (lastTs === null) lastTs = ts;
          var dt = Math.min(0.05, (ts - lastTs) / 1000);
          lastTs = ts;

          if (phase === "ramp") {
            var t = clamp01((ts - startTs) / CONFIG.RAMP_MS);
            currentRps =
              CONFIG.START_RPS +
              (CONFIG.END_RPS - CONFIG.START_RPS) * easeInCubic(t);
            rotation += currentRps * 360 * dt;
            wheel.style.transform = "rotate(" + rotation + "deg)";

            if (t >= 1) {
              startParticlizer(ts);
              return;
            }
            requestAnimationFrame(tick);
          }
        }

        fetch(CONFIG.FONT_URL)
          .then(function (res) {
            if (!res.ok) throw new Error("Failed to load " + CONFIG.FONT_URL);
            return res.arrayBuffer();
          })
          .then(function (buf) {
            fontData = new Uint8Array(buf);
            buildRing();
            if (!reduceMotion) requestAnimationFrame(tick);
          })
          .catch(function (err) {
            console.error(err);
          });
      })();
    </script>
  </body>
</html>
